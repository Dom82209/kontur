[package]
name = "kontur"
version = "0.1.0"
description = "Контур — учебный процесс без хаоса (frontend shell)"
edition = "2021"

[lib]
name = "kontur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
imagesize = { version = "0.15", default-features = false, features = ["bmp", "gif", "heif", "jpeg", "png", "tiff", "webp"] }
lopdf = { version = "0.46", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
quick-xml = "0.42"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tauri = { version = "2", features = ["macos-private-api", "test"] }
